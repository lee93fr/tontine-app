<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bgT" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="coinT" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="handL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="handR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Fond rond indigo -->
  <rect width="64" height="64" rx="14" fill="url(#bgT)"/>

  <!-- Bras / poignet gauche -->
  <path d="M 4 44 L 22 32 L 30 38 L 14 50 Z"
        fill="url(#handL)" stroke="#7c2d12" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Doigts gauches (4 phalanges) -->
  <path d="M 22 32 q 4 -1 6 1 t 5 4 q 1 1 0.5 2 t -2 0.5 q -3 -2 -6 -3 t -3.5 -4.5 Z"
        fill="url(#handL)" stroke="#7c2d12" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Bras / poignet droit -->
  <path d="M 60 20 L 42 32 L 34 26 L 50 14 Z"
        fill="url(#handR)" stroke="#7c2d12" stroke-width="0.7" stroke-linejoin="round"/>
  <!-- Doigts droits -->
  <path d="M 42 32 q -4 1 -6 -1 t -5 -4 q -1 -1 -0.5 -2 t 2 -0.5 q 3 2 6 3 t 3.5 4.5 Z"
        fill="url(#handR)" stroke="#7c2d12" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Pièce € centrale en superposition -->
  <circle cx="32" cy="32" r="10.5" fill="url(#coinT)" stroke="#7c2d12" stroke-width="1"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#b45309" stroke-width="0.6" opacity="0.6"/>
  <text x="32" y="36.5" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-weight="900"
        font-size="13" fill="#7c2d12" letter-spacing="-0.5">€</text>
</svg>
